<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Modulatio brand mark — μ on deep-navy field, hot phosphor stroke -->
  <rect width="64" height="64" fill="#0a1628"/>
  <g fill="none" stroke="#FF6B35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical with descender + terminal curl -->
    <path d="M 18 12 L 18 50 Q 18 55 24 53"/>
    <!-- Bottom u-curve connecting left to right at the baseline -->
    <path d="M 18 40 Q 18 44 22 44 L 42 44 Q 46 44 46 40"/>
    <!-- Right vertical (no descender) -->
    <path d="M 46 40 L 46 12"/>
  </g>
</svg>
